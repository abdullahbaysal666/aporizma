<h1>{{s.h1}}</h1>
<p class="lede">{{s.lede}}</p>
<div class="card stack">
  <div class="dropzone" id="drop">{{s.drop}}</div>
  <input type="file" id="file" accept="image/*" hidden>
  <p class="note" id="status">{{s.empty}}</p>
  <div>
    <label class="note" for="k">{{s.k_label}}: <span id="kval">6</span></label><br>
    <input type="range" id="k" min="3" max="10" value="6" style="width:200px">
  </div>
  <div id="results" style="display:none"></div>
</div>
<section>{{s.faq_html}}</section>
