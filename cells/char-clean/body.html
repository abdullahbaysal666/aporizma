<h1>{{s.h1}}</h1>
<p class="lede">{{s.lede}}</p>
<div class="card stack">
  <textarea id="input" rows="7" placeholder="{{s.input_ph}}" spellcheck="false"
    style="font-family:ui-monospace,Consolas,monospace;font-size:.95rem"></textarea>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label class="note"><input type="checkbox" id="opt-invisible" checked> {{s.opt_invisible}}</label>
    <label class="note"><input type="checkbox" id="opt-spaces" checked> {{s.opt_spaces}}</label>
    <label class="note"><input type="checkbox" id="opt-quotes" checked> {{s.opt_quotes}}</label>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    <button class="btn" id="clean">{{s.clean}}</button>
    <button class="btn ghost" id="copy" hidden>{{s.copy}}</button>
  </div>
  <p class="note" id="status">{{s.empty}}</p>
  <textarea id="output" rows="7" readonly spellcheck="false"
    style="font-family:ui-monospace,Consolas,monospace;font-size:.95rem"></textarea>
</div>
<section>{{s.faq_html}}</section>
