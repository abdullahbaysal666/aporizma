<h1>{{s.h1}}</h1>
<p class="lede">{{s.lede}}</p>

<div class="card stack">
  <h2 style="margin:0;font-size:1.05rem">{{s.section1_title}}</h2>
  <div class="ar-row">
    <div>
      <label class="note" for="width">{{s.width_label}}</label>
      <input type="number" id="width" min="1" step="1" value="1920" inputmode="numeric">
    </div>
    <div>
      <label class="note" for="height">{{s.height_label}}</label>
      <input type="number" id="height" min="1" step="1" value="1080" inputmode="numeric">
    </div>
  </div>
  <div>
    <div class="note">{{s.ratio_result_label}}</div>
    <div id="ratio-result" style="font-size:1.3rem;font-weight:700"></div>
  </div>
</div>

<div class="card stack">
  <h2 style="margin:0;font-size:1.05rem">{{s.section2_title}}</h2>
  <label class="note">{{s.presets_label}}</label>
  <div id="presets" style="display:flex;flex-wrap:wrap;gap:8px"></div>
  <div class="ar-row">
    <div>
      <label class="note" for="ratio-w">{{s.ratio_w_label}}</label>
      <input type="number" id="ratio-w" min="1" step="any" value="16" inputmode="numeric">
    </div>
    <div>
      <label class="note" for="ratio-h">{{s.ratio_h_label}}</label>
      <input type="number" id="ratio-h" min="1" step="any" value="9" inputmode="numeric">
    </div>
  </div>
  <div class="ar-row">
    <div>
      <label class="note" for="known-side">{{s.known_label}}</label>
      <select id="known-side">
        <option value="width">{{s.known_width}}</option>
        <option value="height">{{s.known_height}}</option>
      </select>
    </div>
    <div>
      <label class="note" for="known-value">{{s.known_value_label}}</label>
      <input type="number" id="known-value" min="1" step="any" value="1920" inputmode="numeric">
    </div>
  </div>
  <div>
    <div class="note">{{s.result_label}}</div>
    <div id="dim-result" style="font-size:1.3rem;font-weight:700"></div>
  </div>
</div>

<section>{{s.faq_html}}</section>

<style>
.ar-row { display: flex; gap: 14px; flex-wrap: wrap; }
.ar-row > div { flex: 1 1 140px; min-width: 120px; }
</style>
