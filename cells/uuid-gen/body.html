<h1>{{s.h1}}</h1>
<p class="lede">{{s.lede}}</p>
<div class="card stack">
  <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
    <label class="note" for="count">{{s.count_label}}</label>
    <input type="number" id="count" min="1" max="1000" value="5" style="max-width:100px">
    <label class="note"><input type="checkbox" id="hyphens" checked> {{s.hyphens_label}}</label>
    <label class="note"><input type="checkbox" id="uppercase"> {{s.uppercase_label}}</label>
    <button class="btn" id="generate">{{s.generate}}</button>
  </div>
  <textarea id="output" rows="10" spellcheck="false" readonly style="font-family:ui-monospace,Consolas,monospace;overflow-x:auto;white-space:pre"></textarea>
  <p class="note" id="status"></p>
  <div>
    <button class="btn" id="copy">{{s.copy}}</button>
    <button class="btn ghost" id="download">{{s.download}}</button>
  </div>
</div>
<section>{{s.faq_html}}</section>
